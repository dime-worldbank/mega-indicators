bundle:
  name: mega_indicators

include:
  - resources/*.yml

# Run everything as the RPF service principal, a stable non-human owner, so the
# CAN_MANAGE grant below doesn't require reassigning pre-existing resources away
# from whoever's personal account deployed them.
run_as:
  service_principal_name: a8a8db79-8e75-4dcd-b321-de8ad6018e25

permissions:
  - group_name: ITSDA-LKHS-DAP-PROD-boostprocessed
    level: CAN_MANAGE

variables:
  shared_cluster_id:
    description: Existing all-purpose cluster the notebook tasks run on.
    default: "1111-165457-9ia3jd1w"

targets:
  # Shared dev environment: one team-visible copy (like staging), run as the SP,
  # writing to the indicator_dev schema. Last deploy wins — coordinate branches.
  dev:
    mode: production
    presets:
      name_prefix: "[dev] "
    resources:
      pipelines:
        admin_boundaries_tl_uc:
          schema: indicator_dev
        subnational_poverty_index_uc:
          schema: indicator_dev
        subnational_human_development_index_uc:
          schema: indicator_dev
        subnational_population_agg_uc:
          schema: indicator_dev
        public_sector_employment_uc:
          schema: indicator_dev
        indicator_data_availability_uc:
          schema: indicator_dev
      # Always paused (dev runs are manual); crons offset from staging's, which
      # are offset from prod's, in case one is ever unpaused for validation.
      jobs:
        indicators_weekly:
          schedule:
            pause_status: PAUSED
            quartz_cron_expression: 28 17 8 ? * Wed
            timezone_id: UTC
        indicators_monthly:
          schedule:
            pause_status: PAUSED
            quartz_cron_expression: 28 17 13 5 * ?
            timezone_id: UTC
    workspace:
      host: https://adb-6102124407836814.14.azuredatabricks.net
      root_path: /Workspace/Repos/boostprocessed/.bundle/${bundle.name}/${bundle.target}

  staging:
    mode: production
    default: true
    presets:
      name_prefix: "[staging] "
    # DLT LIVE TABLES write to the staging schema (notebooks resolve it from bundle_target).
    resources:
      pipelines:
        admin_boundaries_tl_uc:
          schema: indicator_staging
        subnational_poverty_index_uc:
          schema: indicator_staging
        subnational_human_development_index_uc:
          schema: indicator_staging
        subnational_population_agg_uc:
          schema: indicator_staging
        public_sector_employment_uc:
          schema: indicator_staging
        indicator_data_availability_uc:
          schema: indicator_staging
      # Always paused, and offset a day from prod's cron even so, in case a schedule is
      # ever unpaused for periodic validation.
      jobs:
        indicators_weekly:
          schedule:
            pause_status: PAUSED
            quartz_cron_expression: 28 17 8 ? * Tue
            timezone_id: UTC
        indicators_monthly:
          schedule:
            pause_status: PAUSED
            quartz_cron_expression: 28 17 13 4 * ?
            timezone_id: UTC
    workspace:
      host: https://adb-6102124407836814.14.azuredatabricks.net
      root_path: /Workspace/Repos/boostprocessed/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    # All schedules live here, not in the job ymls, so every target's is in one place.
    # on_demand has no schedule at all (triggered manually only), for either target.
    # Failure emails are prod-only — a staging failure shouldn't page anyone.
    resources:
      jobs:
        indicators_on_demand:
          email_notifications:
            on_failure:
            - ysuzuki2@worldbank.org
            - wlu4@worldbank.org
        indicators_weekly:
          schedule:
            pause_status: UNPAUSED
            quartz_cron_expression: 28 17 8 ? * Mon
            timezone_id: UTC
          email_notifications:
            on_failure:
            - wlu4@worldbank.org
            - ysuzuki2@worldbank.org
        indicators_monthly:
          schedule:
            pause_status: UNPAUSED
            quartz_cron_expression: 28 17 13 3 * ?
            timezone_id: UTC
          email_notifications:
            on_failure:
            - wlu4@worldbank.org
            - ysuzuki2@worldbank.org
    workspace:
      host: https://adb-6102124407836814.14.azuredatabricks.net
      # Team-accessible Git-folders container (not all-users-writable like /Workspace/Shared).
      root_path: /Workspace/Repos/boostprocessed/.bundle/${bundle.name}/${bundle.target}
