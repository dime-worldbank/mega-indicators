bundle:
  name: mega_indicators

include:
  - resources/*.yml

# Run everything as whoever deploys the bundle. A non-admin can only set run_as
# to themselves, so this keeps deploys working until a service principal exists.
run_as:
  user_name: ${workspace.current_user.userName}

permissions:
  - group_name: ITSDA-LKHS-DAP-PROD-boostprocessed
    level: CAN_MANAGE

variables:
  shared_cluster_id:
    description: Existing all-purpose cluster the notebook tasks run on.
    default: "1111-165457-9ia3jd1w"

targets:
  staging:
    mode: production
    default: true
    presets:
      name_prefix: "[staging] "
    # DLT LIVE TABLES write to the staging schema (notebooks resolve it from bundle_target).
    resources:
      pipelines:
        admin_boundaries_tl_uc:
          schema: indicator_staging
        subnational_poverty_index_uc:
          schema: indicator_staging
        subnational_human_development_index_uc:
          schema: indicator_staging
        subnational_population_agg_uc:
          schema: indicator_staging
    workspace:
      host: https://adb-6102124407836814.14.azuredatabricks.net
      root_path: /Workspace/Repos/boostprocessed/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://adb-6102124407836814.14.azuredatabricks.net
      # Team-accessible Git-folders container (not all-users-writable like /Workspace/Shared).
      root_path: /Workspace/Repos/boostprocessed/.bundle/${bundle.name}/${bundle.target}
