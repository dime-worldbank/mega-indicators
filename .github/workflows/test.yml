name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Only the deps the tests actually need — not the full notebook stack
      # (no pyspark, no shapely, etc.). utils.py imports requests and wbgapi at
      # module level, so the local-runtime tests need those two. Keep this list
      # minimal so adding a heavy dependency to a notebook doesn't slow CI down.
      - name: Install test dependencies
        run: pip install pytest pandas requests wbgapi

      # Test paths come from pytest.ini.
      - name: Run tests
        run: pytest -v
