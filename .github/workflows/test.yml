name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The dashboard's Databricks side runs pandas 1.5; local runs use current pandas.
        pandas: ["1.5.3", ""]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pytest pandas${{ matrix.pandas && format('=={0}', matrix.pandas) }} "numpy<2" requests wbgapi openpyxl
      - name: Run tests
        run: pytest -v
