name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # requirements.txt is what the notebooks need off Databricks (no pyspark); the
      # tests run the notebooks, so they need the same, plus pytest.
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest

      # Test paths come from pytest.ini.
      - name: Run tests
        run: pytest -v
