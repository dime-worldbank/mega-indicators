resources:
  jobs:
    indicators_on_demand:
      name: Indicators on Demand
      # Reaches every notebook task as a widget; config.py reads it to pick the schema.
      parameters:
        - name: schema_suffix
          default: "${var.schema_suffix}"
      tasks:
      - task_key: admin1_boundary_extract
        existing_cluster_id: ${var.shared_cluster_id}
        disabled: false
        email_notifications: {}
        notebook_task:
          notebook_path: ../geo/admin_boundaries_extract.py
        run_if: ALL_SUCCESS
        timeout_seconds: 0
        webhook_notifications: {}
      - task_key: admin1_boundary_transform_load
        depends_on:
        - task_key: admin1_boundary_extract
        disabled: false
        email_notifications: {}
        pipeline_task:
          full_refresh: true
          pipeline_id: ${resources.pipelines.admin_boundaries_tl_uc.id}
        run_if: ALL_SUCCESS
        timeout_seconds: 0
        webhook_notifications: {}
      - task_key: country
        depends_on:
        - task_key: admin1_boundary_transform_load
        existing_cluster_id: ${var.shared_cluster_id}
        disabled: false
        email_notifications: {}
        max_retries: 0
        min_retry_interval_millis: 900000
        notebook_task:
          notebook_path: ../country.py
        notification_settings:
          alert_on_last_attempt: true
          no_alert_for_canceled_runs: false
          no_alert_for_skipped_runs: false
        retry_on_timeout: false
        run_if: ALL_SUCCESS
        timeout_seconds: 0
        webhook_notifications: {}
      - task_key: energy
        depends_on:
        - task_key: country
        existing_cluster_id: ${var.shared_cluster_id}
        disabled: false
        email_notifications: {}
        notebook_task:
          notebook_path: ../energy/energy_generation_consumption.py
        notification_settings:
          alert_on_last_attempt: false
          no_alert_for_canceled_runs: false
          no_alert_for_skipped_runs: false
        run_if: ALL_SUCCESS
        timeout_seconds: 0
        webhook_notifications: {}
