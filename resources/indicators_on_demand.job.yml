resources:
  jobs:
    indicators_on_demand:
      name: Indicators on Demand
      # Reaches every notebook task as a widget; config.py reads it to pick the schema.
      parameters:
        - name: schema_suffix
          default: "${var.schema_suffix}"
      tasks:
      - task_key: admin1_boundary_extract
        existing_cluster_id: ${var.shared_cluster_id}
        notebook_task:
          notebook_path: ../geo/admin_boundaries_extract.py
      - task_key: admin1_boundary_transform_load
        depends_on:
        - task_key: admin1_boundary_extract
        pipeline_task:
          full_refresh: true
          pipeline_id: ${resources.pipelines.admin_boundaries_tl_uc.id}
      - task_key: country
        depends_on:
        - task_key: admin1_boundary_transform_load
        existing_cluster_id: ${var.shared_cluster_id}
        notebook_task:
          notebook_path: ../country.py
      - task_key: energy
        depends_on:
        - task_key: country
        existing_cluster_id: ${var.shared_cluster_id}
        notebook_task:
          notebook_path: ../energy/energy_generation_consumption.py
      - task_key: pefa
        existing_cluster_id: ${var.shared_cluster_id}
        notebook_task:
          notebook_path: ../pefa/pefa_transform_load.py
      - task_key: subnational_poverty_index_ET
        existing_cluster_id: ${var.shared_cluster_id}
        notebook_task:
          notebook_path: ../poverty/subnational_poverty/subnational_poverty_index_extract_transform.py
      - task_key: subnational_poverty_index_TL
        depends_on:
        - task_key: subnational_poverty_index_ET
        - task_key: country
        pipeline_task:
          pipeline_id: ${resources.pipelines.subnational_poverty_index_uc.id}
      email_notifications:
        on_failure:
        - ysuzuki2@worldbank.org
        - wlu4@worldbank.org
      max_concurrent_runs: 20
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      schedule:
        pause_status: PAUSED
        quartz_cron_expression: 28 17 8 ? * Mon
        timezone_id: UTC
