resources:
  jobs:
    indicators_weekly:
      name: Indicators.Weekly
      # Job parameter reaches every notebook task as a widget; config.py reads it to
      # pick the target schema. Empty for dev/prod, "_staging" for the staging target.
      parameters:
        - name: schema_suffix
          default: "${var.schema_suffix}"
      tasks:
      - task_key: consumer_price_index
        existing_cluster_id: ${var.shared_cluster_id}
        disabled: false
        email_notifications: {}
        max_retries: 0
        min_retry_interval_millis: 900000
        notebook_task:
          notebook_path: ../consumer_price_index.py
        notification_settings:
          alert_on_last_attempt: true
          no_alert_for_canceled_runs: false
          no_alert_for_skipped_runs: false
        retry_on_timeout: false
        run_if: ALL_SUCCESS
        timeout_seconds: 0
        webhook_notifications: {}
      - task_key: edu_learning_poverty
        existing_cluster_id: ${var.shared_cluster_id}
        disabled: false
        email_notifications: {}
        max_retries: 0
